<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#463DF5"/>
      <stop offset="100%" stop-color="#1B1464"/>
    </radialGradient>
    <pattern id="stipple" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#FFFFFF" opacity="0.4"/>
      <circle cx="5" cy="5" r="0.8" fill="#FFFFFF" opacity="0.6"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#stipple)"/>

  <!-- Geometric Grid & Crosshairs -->
  <line x1="200" y1="20" x2="200" y2="380" stroke="#FFFFFF" stroke-dasharray="2,4" stroke-opacity="0.3"/>
  <line x1="20" y1="200" x2="380" y2="200" stroke="#FFFFFF" stroke-dasharray="2,4" stroke-opacity="0.3"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="200" cy="200" r="148" fill="none" stroke="#FFFFFF" stroke-dasharray="4,8" stroke-opacity="0.5"/>

  <!-- Pineapple Leaves (Geometric wireframe / stippled) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round">
    <path d="M 200 90 C 190 60 170 45 150 45 C 175 65 185 85 190 100" fill="#FFFFFF" fill-opacity="0.2"/>
    <path d="M 200 90 C 210 60 230 45 250 45 C 225 65 215 85 210 100" fill="#FFFFFF" fill-opacity="0.2"/>
    <path d="M 200 85 C 195 50 190 30 200 20 C 210 30 205 50 200 85" fill="#FFFFFF" fill-opacity="0.3"/>
    <path d="M 195 95 C 175 75 145 70 120 75 C 145 90 170 100 185 110" fill="#FFFFFF" fill-opacity="0.15"/>
    <path d="M 205 95 C 225 75 255 70 280 75 C 255 90 230 100 215 110" fill="#FFFFFF" fill-opacity="0.15"/>
  </g>

  <!-- Pineapple Body (Rhombus facets with stipple dots) -->
  <g fill="#463DF5" stroke="#FFFFFF" stroke-width="1.5">
    <!-- Outer oval shape -->
    <ellipse cx="200" cy="225" rx="65" ry="95" fill="#3A30D8" fill-opacity="0.8" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Diagonal cross hatch wireframe -->
    <path d="M 155 160 L 245 290 M 140 185 L 260 265 M 135 225 L 265 225 M 140 265 L 260 185 M 155 290 L 245 160" stroke="#FFFFFF" stroke-opacity="0.8"/>
    <path d="M 175 140 L 225 310 M 225 140 L 175 310 M 200 130 L 200 320" stroke="#FFFFFF" stroke-opacity="0.6"/>

    <!-- Internal stippled diamond seeds -->
    <circle cx="200" cy="180" r="3" fill="#FFFFFF"/>
    <circle cx="175" cy="205" r="3" fill="#FFFFFF"/>
    <circle cx="225" cy="205" r="3" fill="#FFFFFF"/>
    <circle cx="200" cy="225" r="4" fill="#FFFFFF"/>
    <circle cx="160" cy="235" r="2.5" fill="#FFFFFF"/>
    <circle cx="240" cy="235" r="2.5" fill="#FFFFFF"/>
    <circle cx="178" cy="255" r="3" fill="#FFFFFF"/>
    <circle cx="222" cy="255" r="3" fill="#FFFFFF"/>
    <circle cx="200" cy="275" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Y2K Typography overlay -->
  <text x="200" y="355" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">PORTAL // OBJECT 01</text>
  <text x="200" y="370" font-family="'Space Mono', monospace" font-size="7" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle" letter-spacing="2">Y2K DITHERED BIO-STRUCT</text>
</svg>

