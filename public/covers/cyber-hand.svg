<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#463DF5"/>
      <stop offset="100%" stop-color="#150E4B"/>
    </radialGradient>
    <pattern id="stipple2" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="0.75" fill="#FFFFFF" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg2)"/>
  <rect width="400" height="400" fill="url(#stipple2)"/>

  <!-- Radar circle grids -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.3"/>
  <circle cx="200" cy="200" r="60" fill="none" stroke="#FFFFFF" stroke-opacity="0.4"/>

  <!-- Robotic Cybernetic Hand Reaching Up -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wrist -->
    <path d="M 170 340 L 175 280 L 225 280 L 230 340 Z" fill="#3A30D8" fill-opacity="0.5"/>
    <line x1="180" y1="300" x2="220" y2="300" stroke-dasharray="2,3"/>
    <line x1="182" y1="320" x2="218" y2="320" stroke-dasharray="2,3"/>

    <!-- Palm -->
    <polygon points="175,280 160,230 185,185 225,185 245,235 225,280" fill="#463DF5" fill-opacity="0.7"/>

    <!-- Thumb -->
    <polyline points="160,230 135,210 120,175 130,165 148,190 168,215"/>

    <!-- Index finger -->
    <polyline points="180,185 178,135 175,90 185,85 190,135 190,185"/>

    <!-- Middle finger -->
    <polyline points="195,185 196,125 198,75 208,75 208,125 205,185"/>

    <!-- Ring finger -->
    <polyline points="210,185 214,135 218,95 228,98 224,140 220,185"/>

    <!-- Pinky finger -->
    <polyline points="225,195 235,155 242,125 250,128 244,165 238,205"/>

    <!-- Joint nodes / stippled circles -->
    <circle cx="175" cy="90" r="3" fill="#FFFFFF"/>
    <circle cx="198" cy="75" r="3.5" fill="#FFFFFF"/>
    <circle cx="218" cy="95" r="3" fill="#FFFFFF"/>
    <circle cx="242" cy="125" r="2.5" fill="#FFFFFF"/>
    <circle cx="120" cy="175" r="3" fill="#FFFFFF"/>

    <!-- Energy orb / crystal hovering over palm -->
    <polygon points="200,120 215,145 200,170 185,145" fill="#FFFFFF" fill-opacity="0.8"/>
  </g>

  <!-- Labels -->
  <text x="200" y="365" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">NEURAL CONTACT // 02</text>
  <text x="200" y="380" font-family="'Space Mono', monospace" font-size="7" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle" letter-spacing="2">BIO-INTERFACE PROTOCOL</text>
</svg>

