<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#463DF5"/>
      <stop offset="100%" stop-color="#0E0836"/>
    </radialGradient>
    <pattern id="stipple3" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#FFFFFF" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg3)"/>
  <rect width="400" height="400" fill="url(#stipple3)"/>

  <!-- Perspective grid wireframe plane at bottom -->
  <g stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1">
    <line x1="200" y1="230" x2="30" y2="380"/>
    <line x1="200" y1="230" x2="90" y2="380"/>
    <line x1="200" y1="230" x2="150" y2="380"/>
    <line x1="200" y1="230" x2="200" y2="380"/>
    <line x1="200" y1="230" x2="250" y2="380"/>
    <line x1="200" y1="230" x2="310" y2="380"/>
    <line x1="200" y1="230" x2="370" y2="380"/>
    <line x1="150" y1="270" x2="250" y2="270"/>
    <line x1="110" y1="310" x2="290" y2="310"/>
    <line x1="60" y1="355" x2="340" y2="355"/>
  </g>

  <!-- Nested Rotating Hexagonal Portal Rings -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2">
    <polygon points="200,60 305,120 305,240 200,300 95,240 95,120" stroke-opacity="0.8"/>
    <polygon points="200,85 285,135 285,225 200,275 115,225 115,135" stroke-dasharray="6,4" stroke-opacity="0.9"/>
    <polygon points="200,110 260,145 260,215 200,250 140,215 140,145" stroke-opacity="0.7"/>
    <polygon points="200,135 240,158 240,202 200,225 160,202 160,158" fill="#FFFFFF" fill-opacity="0.1" stroke-opacity="0.9"/>
  </g>

  <!-- Central Star Octahedron -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5">
    <polygon points="200,150 215,180 200,210 185,180" fill-opacity="0.8"/>
    <circle cx="200" cy="180" r="4" fill="#463DF5"/>
  </g>

  <!-- Labels -->
  <text x="200" y="340" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SYSTEM GATEWAY // 03</text>
  <text x="200" y="355" font-family="'Space Mono', monospace" font-size="7" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle" letter-spacing="2">QUANTUM AUDIO DIMENSION</text>
</svg>

